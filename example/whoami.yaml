apiVersion: v1
kind: Namespace
metadata:
  name: whoami
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: whoami
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: hello
          image: traefik/whoami
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hello
  namespace: whoami
spec:
  selector:
    app: hello
  ports:
    - port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami-http
  namespace: whoami
spec:
  parentRefs:
    - kind: Gateway
      name: common
      namespace: kube-public
      sectionName: whoami-http
  hostnames:
    - 123.45.67.89.nip.io
  rules:
    - backendRefs:
        - kind: Service
          name: hello
          namespace: whoami
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
