# /etc/NetworkManager/system-connections/wg0.nmconnection
[connection]
id=wg0
# uuidgen
uuid=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
type=wireguard
interface-name=wg0

[wireguard]
# wireguard binds a local port whether or not it initiates, unset picks a
# random ephemeral one. pinned so firewall rules and audits have one known
# value. change if 40543 clashes with something already on the node.
listen-port=40543
private-key=--output-of-wg-genkey--

[wireguard-peer.--wg-server-pubkey--]
endpoint=203.0.113.1:40543
allowed-ips=10.9.8.0/27;
persistent-keepalive=30

[ipv4]
address1=10.9.8.x/27
method=manual

[ipv6]
addr-gen-mode=default
method=disabled

[proxy]

