# /etc/NetworkManager/system-connections/wg0.nmconnection
[connection]
id=wg0
# uuidgen
uuid=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
type=wireguard
interface-name=wg0

[wireguard]
listen-port=40543
private-key=--output-of-wg-genkey--

# mtu of wg0. wireguard wraps each packet, adding `20 + 8 + 16 + 16 = 60` bytes
# over an ipv4 underlay and `40 + 8 + 16 + 16 = 80` over ipv6 (outer ip, udp,
# wireguard header, poly1305 tag). wg-quick sets the device to the endpoint
# route's mtu minus 80 by itself, but networkmanager does not look at routes
# (https://networkmanager.dev/docs/api/1.52/settings-wireguard.html). unset
# here leaves the kernel's fixed default of 1420: it subtracts the ipv6
# overhead from a hardcoded 1500 (ETH_DATA_LEN), never from the real underlay
# mtu. exact on a 1500/ipv6 path, 20 bytes under on ipv4, and it overshoots
# once `underlay - overhead` drops below 1420 (1480 on ipv4, 1500 on ipv6).
#
# if the underlay is small enough that `underlay - overhead < 1420`, eg. pppoe
# 1492, a provider vxlan/overlay at 1450, another tunnel; that default exceeds
# what the underlay can carry. the tunnel still handshakes, pings and answers
# small requests, but full-size packets are dropped, so tls handshakes,
# image pulls and large transfers hang with no obvious error. set mtu to
# underlay-mtu minus the overhead above, using the ipv6 overhead when unsure
# (`1492 -> 1412`, `1450 -> 1370`).
#
# cilium runs vxlan inside wg0 and derives the pod mtu from this device, so
# lowering it here lowers the pod mtu too.
#mtu=

[wireguard-peer.instance-2-wg-pubkey]
allowed-ips=10.9.8.2/32;

[wireguard-peer.instance-3-wg-pubkey]
allowed-ips=10.9.8.3/32;

[wireguard-peer.instance-4-wg-pubkey]
allowed-ips=10.9.8.4/32;

[ipv4]
address1=10.9.8.1/27
method=manual

[ipv6]
addr-gen-mode=default
method=disabled

[proxy]

