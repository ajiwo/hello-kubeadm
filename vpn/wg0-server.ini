# /etc/NetworkManager/system-connections/wg0.nmconnection
[connection]
id=wg0
# uuidgen
uuid=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
type=wireguard
interface-name=wg0

[wireguard]
listen-port=40543
private-key=--output-of-wg-genkey--

[wireguard-peer.instance-2-wg-pubkey]
allowed-ips=10.9.8.2/32;

[wireguard-peer.instance-3-wg-pubkey]
allowed-ips=10.9.8.3/32;

[wireguard-peer.instance-4-wg-pubkey]
allowed-ips=10.9.8.4/32;

[ipv4]
address1=10.9.8.1/27
method=manual

[ipv6]
addr-gen-mode=default
method=disabled

[proxy]

